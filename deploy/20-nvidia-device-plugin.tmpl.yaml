# NVIDIA device plugin (static manifest pattern from NVIDIA/AKS docs), image mirrored to ACR.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
  labels: {app: nvidia-device-plugin, app.kubernetes.io/part-of: a100-hillclimb}
spec:
  selector:
    matchLabels: {app: nvidia-device-plugin}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels: {app: nvidia-device-plugin}
    spec:
      nodeSelector:
        kubernetes.azure.com/accelerator: nvidia
      priorityClassName: system-node-critical
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: __REGISTRY__/nvidia/k8s-device-plugin:v0.20.2
          env:
            - {name: FAIL_ON_INIT_ERROR, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: device-plugin
          hostPath: {path: /var/lib/kubelet/device-plugins}
